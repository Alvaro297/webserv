server
{
    host 127.0.0.1;
    server_name localhost;

    ipv 4;
    port 8080;
    root www/;
    index index.html;

    client_max_body_size 5M;

    error_page 404 www/errors/404.html;
    error_page 500 www/errors/500.html;
    error_page 504 www/errors/504.html;

    location / {
        root www/;
        index index.html;
        methods GET;
        autoindex on;
    }

    location /cgi {
        root www/cgi/;
        index login.html;
        methods GET;
        cgi_enable on;
        cgi_extension .py /usr/bin/python3;
        cgi_extension .sh /bin/bash;
    }

    location /upload {
        root www/upload/;
        index upload.html;
        methods GET;
        upload_enable on;
        upload_store www/uploads/;
    }

    location /uploads {
        root www/uploads/;
        methods GET POST DELETE;
        autoindex on;
    }

    location /delete {
        root www/delete/;
        index delete.html;
        methods GET;
    }

    location /test-autoindex {
        root www/test-autoindex/;
        methods GET;
        autoindex on;
    }

    location /test-autoindex/folder {
        root www/test-autoindex/folder;
        methods GET;
    }

    location /redirect-test {
        return 302 https://www.youtube.com/watch?v=dQw4w9WgXcQ;
    }

    location /upload-success {
        return 303 /success/success.html;
    }
}
